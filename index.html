<!DOCTYPE html>
<!--
  फाइल: index.html — होम पेज
  यह खाली पन्ना है। बड़ी हेडिंग और फसलें js/home.js से आती हैं।
  यहाँ बदलें: टैब का नाम (title), गूगल के लिए छोटा वर्णन।
  वाक्य यहाँ मत ढूँढें — वे js/home.js में हैं।
  स्क्रिप्ट का क्रम मत बदलें: data.js, site.js, home.js
  body पर data-page="home" रहना चाहिए।
-->
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>फसल भाव | FasalBhav — राजस्थान, गुजरात, मध्य प्रदेश, हरियाणा</title>
  <meta name="description" content="फसल भाव — आज का मंडी भाव। फसल, राज्य और मंडी के नाम से खोजें। राजस्थान, गुजरात, मध्य प्रदेश और हरियाणा।" />
  <link rel="canonical" href="https://www.fasalbhav.in/" />
  <link rel="icon" href="img/logo.png" type="image/png" />
  <link rel="stylesheet" href="css/site.css" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.fasalbhav.in/#website",
          "url": "https://www.fasalbhav.in/",
          "name": "FasalBhav",
          "alternateName": "फसल भाव",
          "inLanguage": "hi-IN"
        },
        {
          "@type": "Organization",
          "@id": "https://www.fasalbhav.in/#organization",
          "name": "FasalBhav",
          "alternateName": "फसल भाव",
          "url": "https://www.fasalbhav.in/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.fasalbhav.in/img/logo.png"
          }
        }
      ]
    }
  </script>
</head>
<body data-page="home">
  <header class="site-header" id="site-header"></header>
  <main class="wrap" id="main"></main>
  <footer class="site-footer" id="foot"></footer>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
